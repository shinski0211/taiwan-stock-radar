name: VCP validation
on:
  push:
    branches: [vcp-backtest-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy yfinance
      - run: python vcp_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: vcp-results
          path: vcp_*.csv
          if-no-files-found: error
